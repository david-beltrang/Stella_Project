name: Compilación y ejecución de pruebas

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Descargar del repositorio
        uses: actions/checkout@v4

      - name: Instalar Oracle JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'oracle'
          cache: 'maven'

      # NUEVO PASO: Crear toolchains.xml con Oracle JDK 17
      - name: Crear toolchains.xml para Oracle JDK 17
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>oracle</vendor>
              </provides>
              <configuration>
                <jdkHome>${env.JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
          echo "toolchains.xml creado:"
          cat ~/.m2/toolchains.xml

      # Verificar que Maven lo detecta (opcional, para debug)
      - name: Verificar toolchain (debug)
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          mvn -X -q -Dexec.args="toolchain" exec:exec | grep -i oracle || true

      - name: Compilar y empaquetar (sin tests)
        run: mvn --batch-mode -DskipTests package

      - name: Ejecutar pruebas (JUnit)
        run: mvn --batch-mode test

      - name: Reporte de pruebas (JUnit XML a Checks)
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

      - name: Publicar cobertura (JaCoCo)
        uses: PavanMudigonda/jacoco-reporter@v4.8
        with:
          coverage_results_path: 'target/site/jacoco/jacoco.xml'
          coverage_report_title: 'Test coverage results'
          coverage_report_name: 'Test coverage results'
          github_token: ${{ secrets.GITHUB_TOKEN }}